name: Build Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Cache SDK Bundle
        id: cache-sdk-bundle
        uses: actions/cache@v4
        with:
          path: src-tauri/sdk-bundle
          key: ${{ runner.os }}-sdk-bundle-${{ hashFiles('scripts/prepare-bundle.ps1') }}

      - name: Cache Tauri NSIS Toolchain
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-nsis-v1

      - name: Prepare Windows SDK Bundle
        if: steps.cache-sdk-bundle.outputs.cache-hit != 'true'
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/prepare-bundle.ps1

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'umeng-dau-client v__VERSION__'
          releaseBody: |
            ## Windows 安装包
            下载 `.exe` 安装包运行，将安卓系统镜像 ZIP 放入「下载」文件夹，打开应用点击初始化即可。
          releaseDraft: false
          prerelease: false
